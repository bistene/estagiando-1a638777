<!DOCTYPE html>
<!--
  ESTAGIANDO — Dashboard da Empresa (pages/dashboard-empresa.html)
  Descrição: Área da empresa logada. Permite cadastrar vagas e ver candidatos.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estagiando — Painel da Empresa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="navbar-logo">Estagi<span>ando</span> 🎓</a>
    <div class="navbar-direita">
      <ul class="navbar-links">
        <li><a href="../index.html">Ver vagas públicas</a></li>
        <li><a href="#" onclick="encerrarSessao()" class="btn btn-secundario btn-sm">Sair</a></li>
      </ul>
      <button class="btn-tema" onclick="alternarTema()" title="Alternar modo escuro" aria-label="Alternar tema"></button>
    </div>
  </nav>

  <main class="dashboard-pagina container">

    <!-- CABEÇALHO -->
    <div class="perfil-header card animar-entrada">
      <div class="perfil-avatar empresa-avatar">🏢</div>
      <div class="perfil-info">
        <h1 class="perfil-nome" id="empresa-nome">Carregando...</h1>
        <p class="perfil-email" id="empresa-email"></p>
        <div class="perfil-tags">
          <span class="tag tag-tech">🏢 Empresa parceira</span>
        </div>
      </div>
    </div>

    <!-- ESTATÍSTICAS -->
    <div class="dash-stats animar-entrada">
      <div class="dash-stat-card card">
        <span class="dash-stat-numero" id="stat-vagas">0</span>
        <span class="dash-stat-label">Vagas publicadas</span>
      </div>
      <div class="dash-stat-card card">
        <span class="dash-stat-numero" id="stat-candidatos">0</span>
        <span class="dash-stat-label">Total de candidatos</span>
      </div>
      <div class="dash-stat-card card">
        <span class="dash-stat-numero">✅</span>
        <span class="dash-stat-label">Conta ativa</span>
      </div>
    </div>

    <!-- FORMULÁRIO: PUBLICAR NOVA VAGA -->
    <div class="dash-secao animar-entrada">
      <h2 class="dash-secao-titulo">➕ Publicar nova vaga</h2>

      <div class="card form-nova-vaga">
        <div id="alerta-vaga" class="alerta"></div>

        <div class="form-grid-2">
          <div class="form-grupo">
            <label class="form-label" for="vaga-titulo">Título da vaga *</label>
            <input class="form-input" type="text" id="vaga-titulo" placeholder="Ex: Estágio em Desenvolvimento Web" />
          </div>

          <div class="form-grupo">
            <label class="form-label" for="vaga-bolsa">Valor da bolsa (R$) *</label>
            <input class="form-input" type="number" id="vaga-bolsa" placeholder="Ex: 800" min="0" />
          </div>

          <div class="form-grupo">
            <label class="form-label" for="vaga-area">Área *</label>
            <select class="form-select" id="vaga-area">
              <option value="">Selecione a área</option>
              <option value="tecnologia">💻 Tecnologia</option>
              <option value="saude">🏥 Saúde</option>
              <option value="design">🎨 Design</option>
              <option value="negocios">💼 Negócios / Administração</option>
              <option value="outros">📚 Outros</option>
            </select>
          </div>

          <div class="form-grupo">
            <label class="form-label" for="vaga-carga">Carga horária *</label>
            <select class="form-select" id="vaga-carga">
              <option value="">Selecione</option>
              <option value="20h/semana">20h/semana</option>
              <option value="30h/semana">30h/semana</option>
              <option value="40h/semana">40h/semana</option>
            </select>
          </div>

          <div class="form-grupo">
            <label class="form-label" for="vaga-estado">Estado *</label>
            <select class="form-select" id="vaga-estado">
              <option value="">Selecione o estado</option>
              <option value="AC">AC — Acre</option>
              <option value="AL">AL — Alagoas</option>
              <option value="AM">AM — Amazonas</option>
              <option value="BA">BA — Bahia</option>
              <option value="CE">CE — Ceará</option>
              <option value="DF">DF — Distrito Federal</option>
              <option value="ES">ES — Espírito Santo</option>
              <option value="GO">GO — Goiás</option>
              <option value="MA">MA — Maranhão</option>
              <option value="MG">MG — Minas Gerais</option>
              <option value="MS">MS — Mato Grosso do Sul</option>
              <option value="MT">MT — Mato Grosso</option>
              <option value="PA">PA — Pará</option>
              <option value="PB">PB — Paraíba</option>
              <option value="PE">PE — Pernambuco</option>
              <option value="PR">PR — Paraná</option>
              <option value="RJ">RJ — Rio de Janeiro</option>
              <option value="RN">RN — Rio Grande do Norte</option>
              <option value="RS">RS — Rio Grande do Sul</option>
              <option value="SC">SC — Santa Catarina</option>
              <option value="SE">SE — Sergipe</option>
              <option value="SP">SP — São Paulo</option>
              <option value="TO">TO — Tocantins</option>
            </select>
          </div>

          <div class="form-grupo">
            <label class="form-label" for="vaga-cidade">Cidade *</label>
            <input class="form-input" type="text" id="vaga-cidade" placeholder="Ex: São Paulo" />
          </div>
        </div>

        <div class="form-grupo">
          <label class="form-label" for="vaga-descricao">Descrição da vaga *</label>
          <textarea
            class="form-input"
            id="vaga-descricao"
            rows="4"
            placeholder="Descreva as atividades, requisitos e diferenciais da vaga..."
            style="resize:vertical"
          ></textarea>
        </div>

        <button class="btn btn-primario" onclick="publicarVaga()">
          📢 Publicar vaga
        </button>
      </div>
    </div>

    <!-- MINHAS VAGAS PUBLICADAS -->
    <div class="dash-secao animar-entrada">
      <h2 class="dash-secao-titulo">📋 Minhas vagas publicadas</h2>
      <div id="lista-vagas-empresa">
        <!-- Preenchido pelo JS -->
      </div>
    </div>

  </main>

  <footer>
    <p>Feito com 💙 pela turma de ADS — <strong>Estagiando</strong> &copy; 2025</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/dashboard-empresa.js"></script>
</body>
</html>
