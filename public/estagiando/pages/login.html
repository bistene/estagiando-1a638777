<!DOCTYPE html>
<!--
  ESTAGIANDO — Página de Login (pages/login.html)
  Descrição: Tela dividida para login de Estudante e Empresa.
             Inclui cadastro e alternância entre os dois perfis.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estagiando — Entrar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

  <!-- Volta um nível para pegar o CSS (estamos dentro de /pages/) -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

  <!-- Navbar mínima -->
  <nav class="navbar">
    <a href="../index.html" class="navbar-logo">Estagi<span>ando</span> 🎓</a>
    <div style="display:flex;align-items:center;gap:1rem">
      <a href="../index.html" class="btn btn-secundario btn-sm">← Ver vagas</a>
      <button class="btn-tema" onclick="alternarTema()" title="Alternar modo escuro" aria-label="Alternar tema"></button>
    </div>
  </nav>

  <!-- =====================================================
       LAYOUT PRINCIPAL: dois painéis lado a lado
       ===================================================== -->
  <main class="login-pagina">

    <!-- PAINEL ESQUERDO — Decorativo (some em mobile) -->
    <div class="login-painel-esq">
      <div class="login-ilustracao">
        <div class="ilustr-circulo grande"></div>
        <div class="ilustr-circulo medio"></div>
        <div class="ilustr-circulo pequeno"></div>

        <div class="ilustr-texto">
          <h2>Conectando<br/>futuros!</h2>
          <p>A plataforma que liga estudantes às melhores oportunidades de estágio.</p>

          <!-- Mini cards flutuantes decorativos -->
          <div class="mini-card">
            <span>🎓</span> Estudantes conectados
          </div>
          <div class="mini-card" style="margin-left:2rem;margin-top:0.6rem">
            <span>🚀</span> Oportunidades de estágio
          </div>
        </div>
      </div>
    </div>

    <!-- PAINEL DIREITO — Formulário de login/cadastro -->
    <div class="login-painel-dir">
      <div class="login-form-container card animar-entrada">

        <!-- ABAS: Login ou Cadastro -->
        <div class="abas">
          <button class="aba ativo" id="aba-login" onclick="mostrarAba('login')">
            Entrar
          </button>
          <button class="aba" id="aba-cadastro" onclick="mostrarAba('cadastro')">
            Cadastrar
          </button>
        </div>

        <!-- Alerta de feedback -->
        <div id="alerta-login" class="alerta"></div>

        <!-- =====================================================
             FORMULÁRIO DE LOGIN
             ===================================================== -->
        <div id="form-login">
          <div class="form-grupo">
            <label class="form-label" for="login-email">E-mail</label>
            <input
              class="form-input"
              type="email"
              id="login-email"
              placeholder="seu@email.com"
            />
          </div>

          <div class="form-grupo">
            <label class="form-label" for="login-senha">Senha</label>
            <div class="input-senha-wrapper">
              <input
                class="form-input"
                type="password"
                id="login-senha"
                placeholder="••••••••"
              />
              <button type="button" class="btn-olho" onclick="alternarSenha('login-senha', this)" aria-label="Mostrar/ocultar senha" title="Mostrar senha">
                👁️
              </button>
            </div>
          </div>

          <button class="btn btn-primario" style="width:100%;margin-top:0.5rem" onclick="fazerLogin()">
            Entrar na plataforma
          </button>

          <p class="link-alternar">
            Não tem conta?
            <a href="#" onclick="mostrarAba('cadastro')">Cadastre-se grátis</a>
          </p>
        </div>

        <!-- =====================================================
             FORMULÁRIO DE CADASTRO
             ===================================================== -->
        <div id="form-cadastro" style="display:none">

          <!-- Campo: Nome -->
          <div class="form-grupo">
            <label class="form-label" for="cad-nome" id="label-nome">Nome completo</label>
            <input
              class="form-input"
              type="text"
              id="cad-nome"
              placeholder="Seu nome"
            />
          </div>

          <!-- Campo: E-mail -->
          <div class="form-grupo">
            <label class="form-label" for="cad-email">E-mail</label>
            <input
              class="form-input"
              type="text"
              id="cad-email"
              placeholder="seu@email.com"
              oninput="validarEmailAoDigitar(this)"
            />
            <span id="feedback-email" style="font-size:0.8rem;margin-top:0.2rem;display:none"></span>
          </div>

          <!-- Campo: CPF (apenas estudante) -->
          <div class="form-grupo" id="campo-cpf">
            <label class="form-label" for="cad-cpf">CPF</label>
            <input
              class="form-input"
              type="text"
              id="cad-cpf"
              placeholder="000.000.000-00"
              maxlength="14"
              oninput="mascararCpf(this)"
            />
            <span id="feedback-cpf" style="font-size:0.8rem;margin-top:0.2rem;display:none"></span>
          </div>

          <!-- Campo: Senha -->
          <div class="form-grupo">
            <label class="form-label" for="cad-senha">Senha</label>
            <div class="input-senha-wrapper">
              <input
                class="form-input"
                type="password"
                id="cad-senha"
                placeholder="Mínimo 6 caracteres"
              />
              <button type="button" class="btn-olho" onclick="alternarSenha('cad-senha', this)" aria-label="Mostrar/ocultar senha" title="Mostrar senha">
                👁️
              </button>
            </div>
          </div>

          <!-- Campo extra para estudante: área de interesse -->
          <div class="form-grupo" id="campo-area" >
            <label class="form-label" for="cad-area">Área de interesse</label>
            <select class="form-select" id="cad-area">
              <option value="">Selecione sua área</option>
              <option value="tecnologia">💻 Tecnologia</option>
              <option value="saude">🏥 Saúde</option>
              <option value="design">🎨 Design</option>
              <option value="negocios">💼 Negócios / Administração</option>
              <option value="outros">📚 Outros</option>
            </select>
          </div>

          <!-- =====================================================
               ENDEREÇO COM BUSCA DE CEP
               ===================================================== -->
          <div class="divisor" style="margin: 1rem 0 1.2rem"></div>
          <p class="form-label" style="margin-bottom:1rem;font-size:0.95rem;color:var(--texto-principal)">📍 Endereço</p>

          <!-- CEP + botão buscar -->
          <div class="form-grupo">
            <label class="form-label" for="cad-cep">CEP</label>
            <div style="display:flex;gap:0.6rem;align-items:center">
              <input
                class="form-input"
                type="text"
                id="cad-cep"
                placeholder="00000-000"
                maxlength="9"
                style="flex:1"
                oninput="mascararCep(this)"
              />
              <button
                type="button"
                class="btn btn-primario btn-sm"
                id="btn-buscar-cep"
                onclick="buscarCep()"
                style="white-space:nowrap;height:44px"
              >
                🔍 Buscar
              </button>
            </div>
            <div id="alerta-cep" class="alerta" style="margin-top:0.5rem;margin-bottom:0"></div>
          </div>

          <div class="form-grupo">
            <label class="form-label" for="cad-rua">Endereço</label>
            <input class="form-input" type="text" id="cad-rua" placeholder="Rua, Avenida..." readonly style="background:var(--fundo-input);opacity:0.8" />
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 1rem">
            <div class="form-grupo">
              <label class="form-label" for="cad-numero">Número</label>
              <input class="form-input" type="text" id="cad-numero" placeholder="Ex: 123" />
            </div>
            <div class="form-grupo">
              <label class="form-label" for="cad-complemento">Complemento</label>
              <input class="form-input" type="text" id="cad-complemento" placeholder="Apto, Bloco..." />
            </div>
          </div>

          <div class="form-grupo">
            <label class="form-label" for="cad-bairro">Bairro</label>
            <input class="form-input" type="text" id="cad-bairro" placeholder="Bairro" readonly style="background:var(--fundo-input);opacity:0.8" />
          </div>

          <div style="display:grid;grid-template-columns:1fr 80px;gap:0 1rem">
            <div class="form-grupo">
              <label class="form-label" for="cad-cidade">Cidade</label>
              <input class="form-input" type="text" id="cad-cidade" placeholder="Cidade" readonly style="background:var(--fundo-input);opacity:0.8" />
            </div>
            <div class="form-grupo">
              <label class="form-label" for="cad-uf">UF</label>
              <input class="form-input" type="text" id="cad-uf" placeholder="UF" readonly style="background:var(--fundo-input);opacity:0.8" />
            </div>
          </div>

          <button class="btn btn-primario" style="width:100%;margin-top:0.5rem" onclick="fazerCadastro()">
            Criar minha conta
          </button>

          <p class="link-alternar">
            Já tem conta?
            <a href="#" onclick="mostrarAba('login')">Entrar</a>
          </p>
        </div>

      </div>
    </div>

  </main>

  <!-- =====================================================
       BOTÃO FLUTUANTE DE ACESSIBILIDADE
       ===================================================== -->
  <div class="acess-widget" id="acess-widget">
    <!-- Botão principal -->
    <button class="acess-btn-principal" id="acess-toggle" onclick="toggleAcessWidget()" aria-label="Opções de acessibilidade" title="Acessibilidade">
      ♿
    </button>

    <!-- Painel expandido -->
    <div class="acess-painel" id="acess-painel" aria-hidden="true">
      <div class="acess-painel-titulo">Acessibilidade</div>

      <div class="acess-opcao">
        <span class="acess-opcao-label">Tamanho da fonte</span>
        <div class="acess-font-controles">
          <button class="acess-font-btn" onclick="alterarFonte(-1)" aria-label="Diminuir fonte" title="Diminuir fonte">A−</button>
          <span class="acess-font-valor" id="acess-font-valor">100%</span>
          <button class="acess-font-btn" onclick="alterarFonte(1)" aria-label="Aumentar fonte" title="Aumentar fonte">A+</button>
        </div>
      </div>

      <button class="acess-reset" onclick="resetarAcessibilidade()">↺ Resetar</button>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/login.js"></script>
  <script>
    /* ── Máscara de CEP: 00000-000 ── */
    function mascararCep(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 8);
      if (v.length > 5) v = v.substring(0, 5) + '-' + v.substring(5);
      input.value = v;
    }

    /* ── Busca de CEP via ViaCEP ── */
    async function buscarCep() {
      const cep = document.getElementById('cad-cep').value.replace(/\D/g, '');
      const alertaEl = document.getElementById('alerta-cep');
      const btnBuscar = document.getElementById('btn-buscar-cep');

      alertaEl.style.display = 'none';

      if (cep.length !== 8) {
        alertaEl.className = 'alerta alerta-erro';
        alertaEl.textContent = 'Digite um CEP válido com 8 dígitos.';
        alertaEl.style.display = 'block';
        return;
      }

      btnBuscar.textContent = '⏳ Buscando...';
      btnBuscar.disabled = true;

      try {
        const res  = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
        const data = await res.json();

        if (data.erro) {
          alertaEl.className = 'alerta alerta-erro';
          alertaEl.textContent = 'CEP não encontrado. Verifique e tente novamente.';
          alertaEl.style.display = 'block';
        } else {
          document.getElementById('cad-rua').value    = data.logradouro || '';
          document.getElementById('cad-bairro').value = data.bairro     || '';
          document.getElementById('cad-cidade').value = data.localidade || '';
          document.getElementById('cad-uf').value     = data.uf         || '';
          document.getElementById('cad-numero').focus();

          alertaEl.className = 'alerta alerta-sucesso';
          alertaEl.textContent = '✅ Endereço encontrado!';
          alertaEl.style.display = 'block';
          setTimeout(function() { alertaEl.style.display = 'none'; }, 3000);
        }
      } catch (e) {
        alertaEl.className = 'alerta alerta-erro';
        alertaEl.textContent = 'Erro ao buscar o CEP. Verifique sua conexão.';
        alertaEl.style.display = 'block';
      } finally {
        btnBuscar.textContent = '🔍 Buscar';
        btnBuscar.disabled = false;
      }
    }

    /* Permite buscar pressionando Enter no campo de CEP */
    document.addEventListener('DOMContentLoaded', function () {
      var inputCep = document.getElementById('cad-cep');
      if (inputCep) {
        inputCep.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') buscarCep();
        });
      }
    });

    /* ── Olho — mostrar/ocultar senha ── */
    function alternarSenha(inputId, btn) {
      var input = document.getElementById(inputId);
      var mostrar = input.type === 'password';
      input.type = mostrar ? 'text' : 'password';
      btn.textContent = mostrar ? '🙈' : '👁️';
      btn.title = mostrar ? 'Ocultar senha' : 'Mostrar senha';
    }

    /* ── Acessibilidade: tamanho de fonte ── */
    var nivelFonte = 0; // -2 a +4 (passos de 10%)

    function toggleAcessWidget() {
      var painel = document.getElementById('acess-painel');
      var btn    = document.getElementById('acess-toggle');
      var aberto = painel.classList.toggle('ativo');
      painel.setAttribute('aria-hidden', !aberto);
      btn.classList.toggle('ativo', aberto);
    }

    // Fecha o painel ao clicar fora
    document.addEventListener('click', function(e) {
      var widget = document.getElementById('acess-widget');
      if (widget && !widget.contains(e.target)) {
        document.getElementById('acess-painel').classList.remove('ativo');
        document.getElementById('acess-toggle').classList.remove('ativo');
      }
    });

    function alterarFonte(direcao) {
      nivelFonte = Math.max(-2, Math.min(4, nivelFonte + direcao));
      var porcentagem = 100 + (nivelFonte * 10);
      document.documentElement.style.fontSize = porcentagem + '%';
      document.getElementById('acess-font-valor').textContent = porcentagem + '%';
      localStorage.setItem('estagiando-fonte', nivelFonte);
    }

    function resetarAcessibilidade() {
      nivelFonte = 0;
      document.documentElement.style.fontSize = '';
      document.getElementById('acess-font-valor').textContent = '100%';
      localStorage.removeItem('estagiando-fonte');
    }

    // Restaura preferência salva ao carregar
    (function restaurarFonte() {
      var salvo = localStorage.getItem('estagiando-fonte');
      if (salvo !== null) {
        nivelFonte = parseInt(salvo);
        var porcentagem = 100 + (nivelFonte * 10);
        document.documentElement.style.fontSize = porcentagem + '%';
        var el = document.getElementById('acess-font-valor');
        if (el) el.textContent = porcentagem + '%';
      }
    })();
  </script>
</body>
</html>
